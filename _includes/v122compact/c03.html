<script>
const PLAN={A:{name:'方案 A｜主推：青岛2晚 + 威海2晚 + 威海单日自驾',nights:'北京1｜青岛2｜威海2｜上海2',fit:'第一次带父母远游；兼顾经典、历史与海岸',diff:'青岛不租车；8/24威海单日租车'},B:{name:'方案 B｜零驾驶：青岛2晚 + 威海2晚',nights:'北京1｜青岛2｜威海2｜上海2',fit:'不想承担驾驶、停车、还车变量',diff:'山东段铁路 + 网约车'},C:{name:'方案 C｜青岛深度：青岛3晚 + 威海1晚',nights:'北京1｜青岛3｜威海1｜上海2',fit:'崂山优先，愿意压缩威海',diff:'8/22不转场，多一晚青岛'},D:{name:'方案 D｜山东跨城自驾：青岛→荣成→威海',nights:'北京1｜青岛2｜威海2｜上海2',fit:'驾驶经验充足，想把沿海移动本身当体验',diff:'青岛起租，威海机场还车'},E:{name:'方案 E｜慢节奏减负',nights:'北京1｜青岛2｜威海2｜上海2',fit:'怕热、膝盖一般、宁可少看',diff:'删远郊和高强度项目'}};
let MAPDATA={},LOCS={},researchReady=false,selected=localStorage.getItem('trip:selectedPlan')||'A';
function buttons(){return Object.keys(PLAN).map(k=>`<button class="plan-pick ${k===selected?'active':''}" data-plan="${k}">${k}${k==='A'?' 主推':''}</button>`).join('')}
function renderPickers(){picker.innerHTML=buttons();journeyPicker.innerHTML=buttons();document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{selected=b.dataset.plan;localStorage.setItem('trip:selectedPlan',selected);renderPickers();renderJourney();});journeyTitle.textContent=PLAN[selected].name}
function renderOverview(){overviewRows.innerHTML=Object.entries(PLAN).map(([k,p])=>`<tr data-row="${k}"><td><b>${k}</b></td><td>${p.name}</td><td>${p.nights}</td><td>${p.fit}</td><td>${p.diff}</td></tr>`).join('');overviewRows.querySelectorAll('tr').forEach(r=>r.onclick=()=>{selected=r.dataset.row;localStorage.setItem('trip:selectedPlan',selected);renderPickers();switchView('journey')})}
function switchView(v,sub){document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==v);document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.querySelectorAll('.bottom-nav button').forEach(x=>x.classList.remove('active'));if(v==='overview')document.querySelector('[data-bottom="overview"]').classList.add('active');if(v==='journey')document.querySelector('[data-bottom="days"]').classList.add('active');if(v==='research')document.querySelector(`[data-bottom="${sub==='booking'?'booking':'research'}"]`).classList.add('active');history.replaceState(null,'','#'+v);if(v==='journey')renderJourney();if(v==='research'){ensureResearch().then(()=>{if(sub==='booking')document.getElementById('booking')?.scrollIntoView({behavior:'smooth'})})}window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.querySelector('[data-bottom="overview"]').onclick=()=>switchView('overview');document.querySelector('[data-bottom="days"]').onclick=()=>switchView('journey');document.querySelector('[data-bottom="booking"]').onclick=()=>switchView('research','booking');document.querySelector('[data-bottom="research"]').onclick=()=>switchView('research');goJourney.onclick=()=>switchView('journey');
async function loadBaseline(){if(Object.keys(MAPDATA).length)return;const src=await fetch('../v110/').then(r=>{if(!r.ok)throw new Error('v110 '+r.status);return r.text()});const m0=src.indexOf('window.MAPDATA=')+'window.MAPDATA='.length,m1=src.indexOf(';\nwindow.LOCS=',m0),l0=m1+';\nwindow.LOCS='.length,l1=src.indexOf(';\nconst modeStyle=',l0);if(m1<0||l1<0)throw new Error('route data markers not found');MAPDATA=JSON.parse(src.slice(m0,m1));LOCS=JSON.parse(src.slice(l0,l1));return src}
const modeText={flight:'✈ 飞机',taxi:'🚕 打车',metro:'🚇 地铁',rail:'🚄 铁路',walk:'🚶 步行',drive:'🚗 自驾',ferry:'⛴ 轮渡',airportline:'🚆 机场线'},colors={flight:'#6d4bc3',taxi:'#a45a00',metro:'#247f83',rail:'#205f91',walk:'#666',drive:'#b42318',ferry:'#2e86ab',airportline:'#177245'};
function nodeCity(k){const bj=['PEK','BUPT','BNU','Tiananmen','Mao','Rostrum','Jingshan','Shichahai'],qd=['PVG_QD','QDHotel','Zhanqiao','Navy','OldCity','Signal','Badaguan','Wusi','Olympic','Beer','Laoshan','QDNorth'],wh=['WHStation','WHHotel','Xingfu','WHpark','LiugongDock','Liugong','Haiyuan','HalfMoon','Torch8','IntlBeach','Maotou','WHAirport'],rc=['Naxianghai','Chengshantou'],sh=['PVG','SHHotel','Yuyuan','Bund','Pearl','SHTower','Wukang','SHMuseumEast','Hongqiao'];if(k==='GanzhouAirport')return'赣州';if(bj.includes(k))return'北京';if(qd.includes(k))return'青岛';if(wh.includes(k))return'威海';if(rc.includes(k))return'荣成';if(sh.includes(k))return'上海';return'—'}
function dayDate(d){const m=(d?.title||'').match(/^(\d+\/\d+)/);return m?m[1]:'—'}
function flowMap(d){const date=dayDate(d),pts=d.nodes.map((n,i)=>{const a=LOCS[n[0]];return a?{key:n[0],name:a[0],city:nodeCity(n[0]),time:n[1],note:n[2],i:i+1}:null}).filter(Boolean);if(!pts.length)return'<div class="alert">暂无路线数据</div>';const modes=d.modes||[],uniq=[...new Set(modes.map(m=>modeText[m]||m))],cross=modes.includes('flight')||modes.includes('rail')||modes.includes('airportline');let s=`<div class="route-summary"><div><b>路线类型</b><br>${cross?'跨城转场 / 交通日':'市内 / 近郊执行日'}</div><div><b>关键节点</b><br>${pts.length} 个</div><div><b>主要方式</b><br>${uniq.join(' / ')||'步行 / 打车'}</div></div><div class="flow-steps">`;pts.forEach((p,i)=>{s+=`<div class="flow-step"><div class="num">${i+1}</div><div class="box"><div class="nm">${p.name}</div><div class="citydate">${date}｜${p.city}</div><div class="tm">${p.time}</div><div class="nt">${p.note||''}</div></div></div>`;if(i<pts.length-1){const m=modes[i]||'taxi';s+=`<div class="flow-mode"><span>${modeText[m]||m}</span>${p.name} → ${pts[i+1].name}</div>`}});return s+'</div><div class="caption">每个节点已补日期与所在城市；执行流程图优先表达“先去哪、几点、怎么去、下一站是什么”。</div>'}
