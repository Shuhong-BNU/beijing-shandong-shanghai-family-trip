<section id="journey" class="panel app-view" data-view="journey" hidden><h2>执行行程</h2>
<details class="card amap-settings" id="amapSettings"><summary><b>🗺️ 高德内嵌地图设置</b><span id="amapStatusBadge" class="status-chip">未配置</span></summary><div class="inside">
<div class="amap-settings-grid"><label>JS API Key<input id="amapJsKey" type="password" placeholder="高德 Web 端（JS API）Key" autocomplete="off"></label><label>securityJsCode<input id="amapSecurityCode" type="password" placeholder="高德 JS API 安全密钥" autocomplete="off"></label><label>Web 服务 API Key（可选）<input id="amapWebKey" type="password" placeholder="用于跨城铁路/公交距离与时长" autocomplete="off"></label><label>本站每日未缓存算路上限<input id="amapLocalCap" type="number" min="10" max="300" step="10" value="80"></label></div>
<div class="inline-actions"><button type="button" class="jump-btn" id="saveAmapConfig">保存到当前浏览器并加载地图</button><button type="button" class="secondary-btn" id="clearAmapConfig">清除本机配置</button></div>
<p class="note"><b>不会写入 GitHub：</b>三个 Key 只保存在当前浏览器 localStorage。建议把 <code>shuhong-bnu.github.io</code> 配进高德域名白名单。这里的“每日上限”只是本站客户端保护，不是高德账单硬上限；高德官方规则是月配额超限后可继续消耗流量包/账户余额。</p>
<div class="amap-usage" id="amapUsageText"></div></div></details><div class="card journey-toolbar"><div><div class="kicker">当前执行方案</div><div class="journey-plan-title" id="journeyCurrentTitle">方案 A｜主推：青岛2晚 + 威海2晚 + 威海单日自驾</div><div class="note">如果你在“方案速览”里改了选择，这里会自动同步。这里不再同时显示五套，而是只显示当前方案。</div></div><div class="plan-picker compact" id="journeyPlanPicker"><button type="button" class="plan-pick active" data-plan-pick="A">A</button><button type="button" class="plan-pick" data-plan-pick="B">B</button><button type="button" class="plan-pick" data-plan-pick="C">C</button><button type="button" class="plan-pick" data-plan-pick="D">D</button><button type="button" class="plan-pick" data-plan-pick="E">E</button></div></div><div id="journeyOverviewMount"></div><div id="journeyDaysMount"></div><div id="journeyBookingMount"></div></section>
