name: Freeze AMap route metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeze-amap-routes.yml'
      - 'scripts/freeze_amap_routes.py'
      - 'scripts/route_manifest_v131.json'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify AMap Web Service secret
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/freeze_amap_routes.py --test-only

      - name: Freeze unique route metrics
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/freeze_amap_routes.py

      - name: Show non-secret summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          check=json.loads(Path('assets/data/amap-web-service-check.json').read_text())
          data=json.loads(Path('assets/data/route-metrics-v131.json').read_text())
          print('AMap secret test:', check['status'])
          print('Sample route distance_m:', check['distance_m'])
          print('Sample route duration_s:', check['duration_s'])
          print('Freeze summary:', data['summary'])
          PY

      - name: Commit frozen route data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/amap-web-service-check.json assets/data/route-metrics-v131.json
          if git diff --cached --quiet; then
            echo 'No route-data changes to commit.'
            exit 0
          fi
          git commit -m 'data: freeze AMap route metrics for v1.3.1'
          git push
