name: Freeze AMap route metrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test key and freeze all route metrics
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/freeze_amap_routes_v2.py --test-only
          python3 scripts/freeze_amap_routes_v2.py

      - name: Show non-secret summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          check=json.loads(Path('assets/data/amap-web-service-check.json').read_text())
          data=json.loads(Path('assets/data/route-metrics-v131.json').read_text())
          print('AMap test:', check['status'])
          print('Sample:', check['sample_route'], check['distance_m'], 'm', check['duration_s'], 's')
          print('Freeze summary:', data['summary'])
          PY

      - name: Commit frozen non-secret data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/amap-web-service-check.json assets/data/route-metrics-v131.json
          if git diff --cached --quiet; then
            echo 'Frozen route data is unchanged.'
            exit 0
          fi
          git commit -m 'data: refresh frozen AMap route metrics'
          git push
